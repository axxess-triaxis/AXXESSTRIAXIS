name: Stack E2E (staging)

# Cross-product end-to-end test: AXXESS, Callismatic, Omnidamus, STILL, against staging only
# (tests/stack/guard.ts refuses anything else). Weekly since 2026-11-19 (founder: "Yes, weekly"),
# Monday 03:30 UTC, before the Monday lead-sourcing run. AWS access is the OIDC role from
# infra/stack-e2e-github-role.yaml. A failed run opens (or comments on) a GitHub issue.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stack-e2e
  cancel-in-progress: false

jobs:
  stack-e2e:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      STACK_AXXESS_URL: ${{ vars.STACK_AXXESS_URL }}
      STACK_BUS_ARN: ${{ vars.STACK_BUS_ARN }}
      STACK_ADAPTER_FAILURE_QUEUE_URL: ${{ vars.STACK_ADAPTER_FAILURE_QUEUE_URL }}
      STACK_CALLISMATIC_FUNCTION: ${{ vars.STACK_CALLISMATIC_FUNCTION }}
      STACK_OMNIDAMUS_FUNCTION: ${{ vars.STACK_OMNIDAMUS_FUNCTION }}
      STACK_OMNIDAMUS_SMS_TOPIC_ARN: ${{ vars.STACK_OMNIDAMUS_SMS_TOPIC_ARN }}
      # Two-org scenario (tests/stack/two-org.spec.ts). It skips, with the reason, until these are set.
      STACK_OMNIDAMUS_WHATSAPP_TOPIC_ARN: ${{ vars.STACK_OMNIDAMUS_WHATSAPP_TOPIC_ARN }}
      STACK_ORG_B_WHATSAPP_LINE: ${{ vars.STACK_ORG_B_WHATSAPP_LINE }}
      STACK_RESULTS_SECRET: ${{ secrets.STACK_RESULTS_SECRET }}
      STACK_CALLISMATIC_ADMIN_KEY: ${{ secrets.STACK_CALLISMATIC_ADMIN_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_ORG_ADMIN_ALPHA: ${{ vars.E2E_ORG_ADMIN_ALPHA }}
      E2E_AXXESS_PASSWORD: ${{ secrets.E2E_AXXESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STACK_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm exec playwright test --config playwright.stack.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-stack
          path: playwright-report-stack

  alert-on-failure:
    needs: stack-e2e
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the stack test issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Stack E2E (staging) is failing"
          body="The cross-product staging test failed (${{ github.event_name }}): $RUN_URL. Report artifact: playwright-report-stack."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
