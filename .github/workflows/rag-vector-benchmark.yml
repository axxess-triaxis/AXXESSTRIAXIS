name: RAG Vector Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/services/rag/evaluation/vectorBenchmark/**"
      - "scripts/rag-vector-benchmark.mjs"
      - ".github/workflows/rag-vector-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository: no MongoDB software runs here and no MongoDB result is produced. That half is
# scripts/rag-vector-benchmark-mongo.mjs, run privately.
jobs:
  rag-vector-benchmark:
    name: RAG vector benchmark (pgvector, not required)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A disposable database on this runner: the real migrations, PostgREST, Auth and the real embed
      # function (gte-small runs inside the Edge Runtime image). No hosted project is contacted.
      - name: Start local Supabase
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "EMBED_FUNCTION_SECRET=$secret" > supabase/functions/.env
          echo "RAG_GATE_EMBED_SECRET=$secret" >> "$GITHUB_ENV"
          pnpm exec supabase start --exclude studio,imgproxy,realtime,mailpit,logflare,vector,postgres-meta,supavisor,storage-api

      - name: Read local connection details
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          for pair in API_URL:RAG_GATE_SUPABASE_URL ANON_KEY:RAG_GATE_ANON_KEY SERVICE_ROLE_KEY:RAG_GATE_SERVICE_ROLE_KEY; do
            value="$(sed -n "s/^${pair%%:*}=\"\(.*\)\"$/\1/p" "$RUNNER_TEMP/supabase.env")"
            test -n "$value" || { echo "${pair%%:*} is missing from supabase status"; exit 1; }
            echo "${pair##*:}=$value" >> "$GITHUB_ENV"
          done

      - name: Run vector benchmark
        env:
          RAG_GATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/rag-vector-benchmark.mjs

      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_edge_runtime_axxess-triaxis 2>&1 | tail -40 || true
          docker logs supabase_db_axxess-triaxis 2>&1 | grep -iE "error|fatal" | tail -40 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-vector-benchmark
          path: test-results/rag-vector-benchmark
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
