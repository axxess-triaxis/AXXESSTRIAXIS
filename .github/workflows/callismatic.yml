name: Callismatic

on:
  pull_request:
    paths:
      - 'apps/callismatic/**'
  push:
    branches:
      - main
    paths:
      - 'apps/callismatic/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/callismatic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/callismatic/pyproject.toml
      - run: pip install -e ".[demo,google,whatsapp]"
      - run: pytest
