name: README activity

# Founder rule, 2026-11-25: this README refreshes every 2 days. `main` only takes pull requests, so the
# run opens one that changes README.md between its markers and nothing else, starts Repository Quality on
# it, and merges it when that passes. A merge made with GITHUB_TOKEN starts no other workflow, so a
# README refresh does not redeploy production.

on:
  schedule:
    - cron: "20 19 */2 * *" # every 2 days, 00:50 IST, after the investor sync
  workflow_dispatch:
    inputs:
      merge:
        description: "Merge the pull request when its checks pass"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: readme-activity
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh README
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the branch, merge the pull request
      pull-requests: write # open the pull request
      actions: write # start Repository Quality on the branch
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh the generated block
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional repository variable: titles matching this pattern are not shown.
          README_EXCLUDE_TITLES: ${{ vars.README_EXCLUDE_TITLES }}
        run: |
          cp README.md "$RUNNER_TEMP/before.md"
          node scripts/readme-activity.mjs repo --repo "$GITHUB_REPOSITORY" \
            --check-url https://landing.triaxisventures.com \
            --check-url https://investor.triaxisventures.com \
            --check-url https://lite.triaxisventures.com

      - name: Open the pull request
        id: pr
        if: steps.refresh.outputs.changed == 'true'
        run: |
          node scripts/readme-activity.mjs guard --before "$RUNNER_TEMP/before.md" --after README.md
          test "$(git diff --name-only)" = "README.md"
          branch="automation/readme-activity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "docs: refresh README activity" README.md
          git push origin "$branch"
          for old in $(gh pr list --state open --app github-actions --json number,headRefName -q '.[] | select(.headRefName | startswith("automation/readme-activity-")) | .number'); do
            gh pr close "$old" --comment "Replaced by a newer refresh."
          done
          gh pr create --base main --head "$branch" --title "docs: refresh README activity" \
            --body "Generated by .github/workflows/readme-activity.yml. Changes README.md between its readme-activity markers and nothing else. Merges when Repository Quality passes on this commit."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Repository Quality on it
        if: steps.refresh.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          run=""
          for _ in $(seq 1 12); do
            sleep 10
            run=$(gh run list --workflow ci.yml --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
            if [ -n "$run" ]; then break; fi
          done
          test -n "$run"
          gh run watch "$run" --interval 30 --exit-status > /dev/null

      - name: Merge
        if: steps.refresh.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.merge)
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::warning::main moved while the checks ran; the next refresh replaces this pull request"
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA" --delete-branch
