AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  AXXESS lead-sourcing worker. On a schedule it claims the oldest queued lead-sourcing run from
  AXXESS, crawls the seed companies' public websites (headless Chromium for JavaScript-built
  sites), verifies guessed addresses under the run's credit cap, and posts the candidates back.
  With discovery on, it also runs the AXXESS scheduler and finds companies for scheduled runs with
  an open-weight model on Amazon Bedrock and AgentCore web search. Nothing is contacted from here.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  Stage:
    Type: String
    Default: staging
    AllowedValues: [staging, prod]
  AxxessBaseUrl:
    Type: String
    AllowedPattern: "^https://[a-z0-9.-]+$"
    Description: AXXESS origin the worker claims runs from, without a trailing slash (staging or production).
  WorkerSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
    Description: Secrets Manager ARN of LEAD_SOURCING_WORKER_SECRET (the same value as the AXXESS env var).
  QevSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN of the QuickEmailVerification API key. Empty = guessed addresses are never verified.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: DISABLED deploys the worker without running it; set ENABLED once AXXESS has the matching secret.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email for failure alarms (confirm the SNS subscription email). Empty = no subscription.
  DiscoveryEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true = run the AXXESS scheduler tick and discovery runs (Bedrock + AgentCore web search) before
      crawl runs.
  DiscoveryModelId:
    Type: String
    # 2026-11-18 founder: "Use cheapest oss models, Anthropic later on". Anthropic models are blocked
    # for this account at account level (AccessDeniedException "not available for this account");
    # gpt-oss runs on demand in Sydney itself. Switch back to Haiku by changing this parameter.
    Default: openai.gpt-oss-20b-1:0
    AllowedValues: [openai.gpt-oss-20b-1:0, openai.gpt-oss-120b-1:0, au.anthropic.claude-haiku-5-5]
    Description: Bedrock model for discovery. gpt-oss runs in Sydney only; the au. Haiku profile in Sydney and Melbourne.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the worker; 0 = none. New accounts have a 10-execution limit and Lambda
      refuses any reservation that leaves fewer than 10 unreserved, so keep 0 there. Overlapping
      invocations are safe: a run is claimed only while still queued, and verify credits are reserved
      per run when it is queued.

Conditions:
  HasQev: !Not [!Equals [!Ref QevSecretArn, ""]]
  AlarmByEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/axxess-lead-sourcing-${Stage}
      RetentionInDays: 30

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub axxess-lead-sourcing-${Stage}
      Description: Crawls AXXESS lead-sourcing runs (no imports, no outreach).
      CodeUri: dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 1024
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          AXXESS_BASE_URL: !Ref AxxessBaseUrl
          WORKER_SECRET_ARN: !Ref WorkerSecretArn
          QEV_SECRET_ARN: !If [HasQev, !Ref QevSecretArn, ""]
          STAGE: !Ref Stage
          DISCOVERY_ENABLED: !Ref DiscoveryEnabled
          DISCOVERY_MODEL_ID: !Ref DiscoveryModelId
      Policies:
        - Statement:
            - Sid: ReadWorkerSecrets
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If
                - HasQev
                - [!Ref WorkerSecretArn, !Ref QevSecretArn]
                - [!Ref WorkerSecretArn]
            # Converse is authorised by bedrock:InvokeModel. gpt-oss is on demand in Sydney; the au. Haiku
            # profile routes to Sydney and Melbourne and stays allowed for the later switch back.
            - Sid: InvokeDiscoveryModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:ap-southeast-2::foundation-model/openai.gpt-oss-20b-1:0
                - arn:aws:bedrock:ap-southeast-2::foundation-model/openai.gpt-oss-120b-1:0
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/au.anthropic.claude-haiku-5-5
                - arn:aws:bedrock:ap-southeast-2::foundation-model/anthropic.claude-haiku-5-5
                - arn:aws:bedrock:ap-southeast-4::foundation-model/anthropic.claude-haiku-5-5
            - Sid: WebSearch
              Effect: Allow
              Action: bedrock-agentcore:InvokeWebSearch
              Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1
      Events:
        EveryFiveMinutes:
          Type: ScheduleV2
          Properties:
            # Stage-specific name: without it SAM names the schedule WorkerFunctionEveryFiveMinutes
            # in every stack, and a second stage's deploy fails NAME_CONFLICT_VALIDATION.
            Name: !Sub axxess-lead-sourcing-${Stage}-every-5-min
            ScheduleExpression: rate(5 minutes)
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0

  WorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub axxess-lead-sourcing-alarms-${Stage}
      KmsMasterKeyId: alias/aws/sns

  AlarmTopicEmail:
    Type: AWS::SNS::Subscription
    Condition: AlarmByEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub axxess-lead-sourcing-${Stage}-errors
      AlarmDescription: The lead-sourcing worker failed (claim, crawl or report). Check its log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DiscoveryFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub axxess-lead-sourcing-${Stage}-discovery-failures
      AlarmDescription: A discovery run failed (Bedrock, web search or AXXESS). Check the worker log group.
      Namespace: AXXESS/LeadSourcing
      MetricName: DiscoveryFailures
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DiscoverySearchesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub axxess-lead-sourcing-${Stage}-discovery-searches-high
      AlarmDescription: >-
        More than 500 web searches in a day. The monthly caps in AXXESS should prevent this; the
        AgentCore free tier (5,000 a month) is shared by the whole AWS organization.
      Namespace: AXXESS/LeadSourcing
      MetricName: DiscoverySearches
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  WorkerLogGroupName:
    Value: !Ref WorkerLogGroup
  AlarmTopicArn:
    Value: !Ref AlarmTopic
